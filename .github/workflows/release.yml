name: Build and publish v0.1.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package.py"
permissions:
  contents: read
concurrency:
  group: hamokisync-release-v0.1.0
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libwayland-dev libdbus-1-dev libudev-dev
      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - name: Tests
        run: cargo test --locked --features settings
      - name: Windows / Linux release build
        if: matrix.platform != 'macos'
        run: cargo build --locked --release --features settings --bin hamokisync-daemon --bin hamokisync-settings
      - name: macOS universal build
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --features settings --bin hamokisync-daemon --bin hamokisync-settings --target aarch64-apple-darwin
          cargo build --locked --release --features settings --bin hamokisync-daemon --bin hamokisync-settings --target x86_64-apple-darwin
      - name: Package Windows or Linux
        if: matrix.platform != 'macos'
        run: python scripts/package.py ${{ matrix.platform }} target/release
      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: python3 scripts/package.py macos target
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    name: Publish verified release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd release
          for asset in HamokiSync-windows-x64.zip HamokiSync-linux-x64.tar.gz HamokiSync-macos-universal.zip hamokisync-daemon-windows-x64.exe hamokisync-daemon-linux-x64 hamokisync-daemon-macos-universal hamokisync-settings-windows-x64.exe hamokisync-settings-linux-x64 hamokisync-settings-macos-universal; do
            test -s "$asset"
          done
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite a published version."
            exit 1
          fi
          gh release create v0.1.0 --target "$GITHUB_SHA" --title "HamokiSync v0.1.0" --notes-file ../scripts/release-notes.md *
